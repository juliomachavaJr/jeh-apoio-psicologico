<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Aberta - Jéssica da Alzira</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #F9F7F5;
            --foreground: #3B302B;
            --primary: #AF6A75;
            --warm-rose: #C58791;
            --sage: #A7BEAF;
            --cream: #F6F3EE;
            --gold: #CBA14D;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
        }

        /* flyer-container em Alta Resolução Nativa (900px) */
        .flyer-container {
            background-color: var(--cream);
            width: 900px;
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(59, 48, 43, 0.12);
            position: relative;
            display: flex;
            flex-direction: column;
            border: 2px solid rgba(197, 135, 145, 0.2);
            margin: 20px auto;
        }

        .image-wrapper {
            width: 100%;
            height: 800px; /* Dobro da altura anterior para nitidez máxima */
            position: relative;
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 10%; /* Foco na cabeça e no sofá */
        }

        .image-wrapper::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 300px;
            background: linear-gradient(to top, var(--cream) 0%, transparent 100%);
        }

        .content {
            padding: 0 80px 32px 80px; /* Reduzido padding-bottom de 48px para 32px */
            text-align: center;
            position: relative;
            z-index: 2;
            margin-top: -60px;
        }

        .badge {
            background-color: var(--sage);
            color: white;
            padding: 12px 32px;
            border-radius: 40px;
            font-size: 1.6rem; /* Fonte aumentada para alta resolução */
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 5.6rem; /* Fonte aumentada para alta resolução */
            color: var(--primary);
            margin-bottom: 10px;
            font-weight: 600;
            line-height: 1.1;
        }

        .subtitle {
            font-size: 2.2rem; /* Fonte aumentada para alta resolução */
            color: var(--foreground);
            margin-bottom: 24px; /* Reduzido margin-bottom de 40px para 24px */
            font-family: 'Playfair Display', serif;
            font-style: italic;
        }

        .info-group {
            border-bottom: 2px solid #E5E0DC; /* Linha divisória agora abaixo dos contactos */
            padding-bottom: 16px;
            margin-top: 24px; /* Espaço abaixo do subtítulo */
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            width: 100%;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 1.9rem; /* Fonte aumentada para alta resolução */
            color: var(--foreground);
            font-weight: 400;
        }

        .info-item svg {
            width: 36px; /* Ícones aumentados para alta resolução */
            height: 36px;
            color: var(--gold);
        }
        
        .social-link {
            color: var(--foreground);
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="flyer-container">
        <div class="image-wrapper">
            <img src="YARA8036.jpg" alt="Jéssica da Alzira">
        </div>

        <div class="content">
            <span class="badge">Apoio Psicológico e Emocional</span>
            
            <h1>Agenda<br>Aberta</h1>
            <p class="subtitle">Jéssica da Alzira</p>

            <div class="info-group">
                <div class="info-item">
                    <!-- WhatsApp Official Logo Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
                    <span>+258 87 455 2068</span>
                </div>
                <div class="info-item">
                    <!-- Globe/Web Icon -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-globe"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20"/><path d="M2 12h20"/><path d="M12 2a14.5 14.5 0 0 1 0 20"/></svg>
                    <span class="social-link">apoio.jedalzira.com</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
